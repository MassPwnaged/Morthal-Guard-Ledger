<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Morthal Guard Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e6e9e2;
    --panel: #dde1d7;
    --ink: #1f2422;
    --muted: #6f7a72;
    --rule: #b3bcb2;
    --accent: #2f6f4e;
    --accent-ink: #f4f6f1;
    --alarm: #8c3a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1f1c;
      --panel: #202622;
      --ink: #e4e8e0;
      --muted: #8d978e;
      --rule: #3d4741;
      --accent: #7fb894;
      --accent-ink: #10140f;
      --alarm: #d98e7c;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas: "sidebar topbar" "sidebar main";
    min-height: 100vh;
  }

  /* sidebar */
  nav {
    grid-area: sidebar;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  nav .brand {
    font-size: 1.05rem;
    padding: 0 1.25rem 1.25rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  nav button {
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 1rem;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button.active {
    color: var(--ink);
    border-left-color: var(--accent);
    background: var(--paper);
  }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* topbar */
  header {
    grid-area: topbar;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1rem;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--rule);
  }
  #whoami { font-size: 1rem; }
  #whoami strong { font-weight: 600; }
  header button {
    background: none;
    border: 0;
    border-bottom: 1px solid var(--rule);
    color: var(--muted);
    font: inherit;
    font-size: 0.9rem;
    padding: 0;
    cursor: pointer;
  }
  header button:hover { color: var(--ink); border-bottom-color: var(--accent); }

  /* main */
  main { grid-area: main; padding: 3rem 3rem; overflow-y: auto; }
  .view { display: none; max-width: 40rem; }
  .view.active { display: block; }

  h1 { font-size: clamp(1.5rem, 3.5vw, 2.1rem); font-weight: 400; margin: 0 0 1rem; }
  p { color: var(--muted); line-height: 1.7; }

  .clock-toggle {
    background: var(--ink);
    color: var(--paper);
    border: 0;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.75rem 1.75rem;
    cursor: pointer;
    margin: 1rem 0 2.5rem;
  }
  .clock-toggle.on { background: var(--alarm); }
  .clock-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .clock-toggle[disabled] { opacity: 0.5; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  td.elapsed { font-variant-numeric: tabular-nums; color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; padding: 1rem 0; }
</style>
</head>
<body>

<nav>
  <div class="brand">Morthal Guard Ledger</div>
  <button type="button" class="nav-btn active" data-view="home">Home</button>
  <button type="button" class="nav-btn" data-view="clockin">Clock In</button>
</nav>

<header>
  <span id="whoami"></span>
  <button type="button" id="signout">Sign out</button>
</header>

<main>
  <section class="view active" id="view-home">
    <h1>Evening watch.</h1>
    <p>This is the home page. Replace this with whatever the ledger should actually show — notices, a duty summary, anything you want people to see first.</p>
  </section>

  <section class="view" id="view-clockin">
    <h1>Watch log</h1>
    <button type="button" class="clock-toggle" id="clock-btn" disabled>Loading…</button>
    <table>
      <thead>
        <tr><th>Name</th><th>On watch for</th></tr>
      </thead>
      <tbody id="clock-rows"></tbody>
    </table>
    <p class="empty" id="clock-empty" hidden>No one's clocked in right now.</p>
  </section>
</main>

<script>
  let me = null;
  let entries = [];
  let tickHandle = null;

  const whoami = document.getElementById("whoami");
  const clockBtn = document.getElementById("clock-btn");
  const rows = document.getElementById("clock-rows");
  const emptyNote = document.getElementById("clock-empty");

  /* ---- nav ---- */
  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
    });
  });

  /* ---- identity ---- */
  fetch("/api/me")
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((data) => {
      me = data.user;
      whoami.innerHTML = "Signed in as <strong>" + escapeHtml(me) + "</strong>";
    })
    .catch(() => { location.assign("/login.html"); });

  document.getElementById("signout").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.assign("/login.html");
  });

  /* ---- clock in/out ---- */
  clockBtn.addEventListener("click", async () => {
    clockBtn.disabled = true;
    try {
      const response = await fetch("/api/clock", { method: "POST" });
      const data = await response.json();
      if (response.ok) {
        entries = data.entries;
        render();
      }
    } catch {}
    clockBtn.disabled = false;
  });

  async function refresh() {
    try {
      const response = await fetch("/api/clockins");
      if (!response.ok) return;
      const data = await response.json();
      entries = data.entries;
      render();
    } catch {}
  }

  function render() {
    const mine = entries.find((e) => e.name === me);
    clockBtn.disabled = false;
    clockBtn.textContent = mine ? "Clock out" : "Clock in";
    clockBtn.classList.toggle("on", Boolean(mine));

    rows.innerHTML = "";
    if (entries.length === 0) {
      emptyNote.hidden = false;
    } else {
      emptyNote.hidden = true;
      for (const entry of entries) {
        const tr = document.createElement("tr");
        const nameTd = document.createElement("td");
        nameTd.textContent = entry.name;
        const timeTd = document.createElement("td");
        timeTd.className = "elapsed";
        timeTd.dataset.since = entry.since;
        timeTd.textContent = formatElapsed(Date.now() - entry.since);
        tr.append(nameTd, timeTd);
        rows.appendChild(tr);
      }
    }
  }

  function tick() {
    document.querySelectorAll("td.elapsed").forEach((td) => {
      const since = Number(td.dataset.since);
      td.textContent = formatElapsed(Date.now() - since);
    });
  }

  function formatElapsed(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return h > 0
      ? h + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s"
      : m + "m " + String(s).padStart(2, "0") + "s";
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  refresh();
  setInterval(refresh, 5000);
  setInterval(tick, 1000);
</script>
</body>
</html>
