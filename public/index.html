<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Morthal Guard Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e6e9e2;
    --panel: #dde1d7;
    --ink: #1f2422;
    --muted: #6f7a72;
    --rule: #b3bcb2;
    --accent: #2f6f4e;
    --accent-ink: #f4f6f1;
    --alarm: #8c3a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1f1c; --panel: #202622; --ink: #e4e8e0; --muted: #8d978e;
      --rule: #3d4741; --accent: #7fb894; --accent-ink: #10140f; --alarm: #d98e7c;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Spectral, Georgia, serif; font-weight: 300;
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas: "sidebar topbar" "sidebar main";
    min-height: 100vh;
  }

  nav {
    grid-area: sidebar; background: var(--panel); border-right: 1px solid var(--rule);
    padding: 1.5rem 0; display: flex; flex-direction: column; gap: 0.25rem;
  }
  nav .brand {
    font-size: 1.05rem; padding: 0 1.25rem 1.25rem; margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  nav button {
    text-align: left; background: none; border: 0; border-left: 3px solid transparent;
    color: var(--muted); font: inherit; font-size: 1rem; padding: 0.65rem 1.25rem; cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button.active { color: var(--ink); border-left-color: var(--accent); background: var(--paper); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  header {
    grid-area: topbar; display: flex; align-items: center; justify-content: flex-end;
    gap: 1rem; padding: 0 1.5rem; border-bottom: 1px solid var(--rule);
  }
  #whoami { font-size: 1rem; }
  #whoami strong { font-weight: 600; }
  .tag {
    display: inline-block; font-size: 0.75rem; letter-spacing: 0.02em;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 3px;
    padding: 0.05rem 0.4rem; margin-left: 0.4rem; vertical-align: middle;
  }
  header button {
    background: none; border: 0; border-bottom: 1px solid var(--rule); color: var(--muted);
    font: inherit; font-size: 0.9rem; padding: 0; cursor: pointer;
  }
  header button:hover { color: var(--ink); border-bottom-color: var(--accent); }

  main { grid-area: main; padding: 3rem 3rem; overflow-y: auto; }
  .view { display: none; max-width: 46rem; }
  .view.active { display: block; }

  h1 { font-size: clamp(1.5rem, 3.5vw, 2.1rem); font-weight: 400; margin: 0 0 1rem; }
  h2 { font-size: 1.1rem; font-weight: 400; margin: 2.5rem 0 0.75rem; }
  p { color: var(--muted); line-height: 1.7; }

  .clock-toggle {
    background: var(--ink); color: var(--paper); border: 0; font: inherit; font-size: 1.05rem;
    padding: 0.75rem 1.75rem; cursor: pointer; margin: 1rem 0 2.5rem;
  }
  .clock-toggle.on { background: var(--alarm); }
  .clock-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .clock-toggle[disabled] { opacity: 0.5; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
  td.elapsed, td.hours { font-variant-numeric: tabular-nums; }
  td.elapsed { color: var(--accent); }
  td.week-total { font-variant-numeric: tabular-nums; font-weight: 600; }
  td.force-out { width: 1%; white-space: nowrap; text-align: right; }
  .empty { color: var(--muted); font-style: italic; padding: 0.75rem 0; }

  .force-btn {
    background: none; border: 1px solid var(--rule); color: var(--muted);
    font: inherit; font-size: 0.85rem; line-height: 1; width: 1.6rem; height: 1.6rem;
    border-radius: 3px; cursor: pointer; padding: 0;
  }
  .force-btn:hover { color: var(--alarm); border-color: var(--alarm); }
  .force-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .force-btn[disabled] { opacity: 0.4; cursor: default; }

  .duty-list { list-style: none; margin: 0; padding: 0; }
  .duty-list li {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0.5rem 0; border-bottom: 1px solid var(--rule); gap: 0.75rem;
  }
  .duty-list .who { display: flex; align-items: center; gap: 0.4rem; }
  .duty-list .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--accent);
    display: inline-block; flex: 0 0 auto;
  }
  .duty-list .right { display: flex; align-items: center; gap: 0.6rem; }
  .duty-list .since { font-variant-numeric: tabular-nums; color: var(--accent); }

  .week-bar { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
  .week-bar button {
    background: none; border: 0; border-bottom: 1px solid var(--rule); color: var(--muted);
    font: inherit; font-size: 0.9rem; padding: 0; cursor: pointer;
  }
  .week-bar button:hover { color: var(--ink); border-bottom-color: var(--accent); }
  .week-bar button[disabled] { opacity: 0.4; cursor: default; }
  .week-bar .label { color: var(--ink); font-size: 1rem; }
  .scope-note { font-size: 0.9rem; font-style: italic; margin-top: 1rem; }
</style>
</head>
<body>

<nav>
  <div class="brand">Morthal Guard Ledger</div>
  <button type="button" class="nav-btn active" data-view="home">Home</button>
  <button type="button" class="nav-btn" data-view="clockin">Clock In</button>
  <button type="button" class="nav-btn" data-view="hours">Hours</button>
</nav>

<header>
  <span id="whoami"></span>
  <button type="button" id="signout">Sign out</button>
</header>

<main>
  <section class="view active" id="view-home">
    <h1>Evening watch.</h1>
    <p>This is the home page. Replace this with whatever the ledger should actually show.</p>

    <h2>On duty now</h2>
    <ul class="duty-list" id="home-duty-list"></ul>
    <p class="empty" id="home-duty-empty" hidden>No one's clocked in right now.</p>
  </section>

  <section class="view" id="view-clockin">
    <h1>Watch log</h1>
    <button type="button" class="clock-toggle" id="clock-btn" disabled>Loading…</button>
    <table>
      <thead><tr><th>Name</th><th>On watch for</th><th></th></tr></thead>
      <tbody id="clock-rows"></tbody>
    </table>
    <p class="empty" id="clock-empty" hidden>No one's clocked in right now.</p>
  </section>

  <section class="view" id="view-hours">
    <h1>Weekly hours</h1>
    <div class="week-bar">
      <button type="button" id="week-prev">‹ Prev week</button>
      <span class="label" id="week-label"></span>
      <button type="button" id="week-next">Next week ›</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
          <th>Thu</th><th>Fri</th><th>Sat</th><th>Week</th>
        </tr>
      </thead>
      <tbody id="hours-rows"></tbody>
    </table>
    <p class="scope-note" id="hours-scope"></p>
  </section>
</main>

<script>
  let me = null;
  let permissions = [];
  let canViewAllHours = false;
  let canManageClockins = false;
  let entries = [];
  let currentWeekKey = null;
  let viewingWeekKey = null;
  let hoursTimer = null;
  let clockPollTimer = null;

  const whoami = document.getElementById("whoami");
  const clockBtn = document.getElementById("clock-btn");
  const rows = document.getElementById("clock-rows");
  const emptyNote = document.getElementById("clock-empty");
  const homeDutyList = document.getElementById("home-duty-list");
  const homeDutyEmpty = document.getElementById("home-duty-empty");
  const hoursRows = document.getElementById("hours-rows");
  const weekLabel = document.getElementById("week-label");
  const weekPrev = document.getElementById("week-prev");
  const weekNext = document.getElementById("week-next");
  const hoursScope = document.getElementById("hours-scope");

  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
      if (btn.dataset.view === "hours") {
        loadHours(viewingWeekKey);
        scheduleHoursPoll();
      } else {
        stopHoursPoll();
      }
    });
  });

  fetch("/api/me")
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((data) => {
      me = data.user;
      permissions = data.permissions || [];
      canViewAllHours = permissions.includes("viewAllHours");
      canManageClockins = permissions.includes("manageClockins");
      whoami.innerHTML = "Signed in as <strong>" + escapeHtml(me) + "</strong>" +
        "<span class=\"tag\">" + escapeHtml(data.rankLabel) + "</span>";
      renderClock(); // re-render now that we know whether to show force-out controls
    })
    .catch(() => { location.assign("/login.html"); });

  document.getElementById("signout").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.assign("/login.html");
  });

  /* ---- clock in/out ----
     Roster is fetched immediately on load regardless of active tab, so
     it's visible on Home before anyone clocks in. Poll cadence is
     adaptive: fast (5s) while someone is on duty, slow (30s) while the
     roster is empty. */
  clockBtn.addEventListener("click", async () => {
    clockBtn.disabled = true;
    try {
      const response = await fetch("/api/clock", { method: "POST" });
      const data = await response.json();
      if (response.ok) { entries = data.entries; renderClock(); }
    } catch {}
    clockBtn.disabled = false;
  });

  async function forceClockOut(name) {
    if (!confirm("Clock out " + name + "? Their current session won't be added to today's hours.")) return;
    try {
      const response = await fetch("/api/clock/force-out", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await response.json();
      if (response.ok) { entries = data.entries; renderClock(); }
      else alert(data.error || "Couldn't clock them out.");
    } catch {
      alert("Couldn't reach the server.");
    }
  }

  async function refreshClock() {
    try {
      const response = await fetch("/api/clockins");
      if (response.ok) {
        const data = await response.json();
        entries = data.entries;
        renderClock();
      }
    } catch {}
    scheduleClockPoll();
  }

  function scheduleClockPoll() {
    clearTimeout(clockPollTimer);
    const delay = entries.length > 0 ? 5000 : 30000;
    clockPollTimer = setTimeout(refreshClock, delay);
  }

  function renderClock() {
    const mine = entries.find((e) => e.name === me);
    clockBtn.disabled = false;
    clockBtn.textContent = mine ? "Clock out" : "Clock in";
    clockBtn.classList.toggle("on", Boolean(mine));

    renderDutyTable();
    renderDutyList();
  }

  function renderDutyTable() {
    rows.innerHTML = "";
    if (entries.length === 0) {
      emptyNote.hidden = false;
      return;
    }
    emptyNote.hidden = true;
    for (const entry of entries) {
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td");
      nameTd.innerHTML = escapeHtml(entry.name) + "<span class=\"tag\">" + escapeHtml(entry.rankLabel) + "</span>";

      const timeTd = document.createElement("td");
      timeTd.className = "elapsed";
      timeTd.dataset.since = entry.since;
      timeTd.textContent = formatElapsed(Date.now() - entry.since);

      const actionTd = document.createElement("td");
      actionTd.className = "force-out";
      if (canManageClockins) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "force-btn";
        btn.textContent = "×";
        btn.title = "Force clock out " + entry.name;
        btn.setAttribute("aria-label", "Force clock out " + entry.name);
        btn.addEventListener("click", () => forceClockOut(entry.name));
        actionTd.appendChild(btn);
      }

      tr.append(nameTd, timeTd, actionTd);
      rows.appendChild(tr);
    }
  }

  function renderDutyList() {
    homeDutyList.innerHTML = "";
    if (entries.length === 0) {
      homeDutyEmpty.hidden = false;
      return;
    }
    homeDutyEmpty.hidden = true;
    for (const entry of entries) {
      const li = document.createElement("li");

      const who = document.createElement("span");
      who.className = "who";
      who.innerHTML = "<span class=\"dot\"></span>" + escapeHtml(entry.name) +
        "<span class=\"tag\">" + escapeHtml(entry.rankLabel) + "</span>";

      const right = document.createElement("span");
      right.className = "right";

      const since = document.createElement("span");
      since.className = "since elapsed";
      since.dataset.since = entry.since;
      since.textContent = formatElapsed(Date.now() - entry.since);
      right.appendChild(since);

      if (canManageClockins) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "force-btn";
        btn.textContent = "×";
        btn.title = "Force clock out " + entry.name;
        btn.setAttribute("aria-label", "Force clock out " + entry.name);
        btn.addEventListener("click", () => forceClockOut(entry.name));
        right.appendChild(btn);
      }

      li.append(who, right);
      homeDutyList.appendChild(li);
    }
  }

  function tickClock() {
    document.querySelectorAll(".elapsed").forEach((el) => {
      const since = Number(el.dataset.since);
      if (!since) return;
      el.textContent = formatElapsed(Date.now() - since);
    });
  }

  function formatElapsed(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return h > 0
      ? h + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s"
      : m + "m " + String(s).padStart(2, "0") + "s";
  }

  /* ---- hours ----
     Anyone without viewAllHours only ever sees their own row, which only
     changes when they clock out. So for them, this loads once per tab-open
     and never polls. Privileged viewers poll, but only while the roster
     shows someone on duty. */
  async function loadHours(weekKey) {
    try {
      const url = weekKey ? "/api/hours?week=" + encodeURIComponent(weekKey) : "/api/hours";
      const response = await fetch(url);
      if (!response.ok) return;
      const data = await response.json();
      if (!currentWeekKey) currentWeekKey = data.weekKey;
      viewingWeekKey = data.weekKey;
      renderHours(data);
    } catch {}
  }

  function scheduleHoursPoll() {
    stopHoursPoll();
    if (!canViewAllHours) return;
    const delay = entries.length > 0 ? 5000 : 30000;
    hoursTimer = setTimeout(() => {
      loadHours(viewingWeekKey);
      scheduleHoursPoll();
    }, delay);
  }

  function stopHoursPoll() {
    clearTimeout(hoursTimer);
    hoursTimer = null;
  }

  function renderHours(data) {
    weekLabel.textContent = "Week of " + data.weekKey;
    weekNext.disabled = data.weekKey === currentWeekKey;

    hoursRows.innerHTML = "";
    for (const person of data.people) {
      const tr = document.createElement("tr");
      const nameTd = document.createElement("td");
      nameTd.innerHTML = escapeHtml(person.name) + "<span class=\"tag\">" + escapeHtml(person.rankLabel) + "</span>";
      tr.appendChild(nameTd);
      for (const day of ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]) {
        const td = document.createElement("td");
        td.className = "hours";
        td.textContent = formatHours(person.days[day] || 0);
        tr.appendChild(td);
      }
      const weekTd = document.createElement("td");
      weekTd.className = "week-total";
      weekTd.textContent = formatHours(person.week);
      tr.appendChild(weekTd);
      hoursRows.appendChild(tr);
    }

    hoursScope.textContent = data.canViewAll
      ? ""
      : "You can only see your own hours.";
  }

  function formatHours(h) {
    const totalMinutes = Math.round(h * 60);
    const hh = Math.floor(totalMinutes / 60);
    const mm = totalMinutes % 60;
    return hh + "h " + String(mm).padStart(2, "0") + "m";
  }

  function shiftWeekKey(weekKey, deltaWeeks) {
    const [y, m, d] = weekKey.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + deltaWeeks * 7);
    return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") +
      "-" + String(dt.getUTCDate()).padStart(2, "0");
  }

  weekPrev.addEventListener("click", () => loadHours(shiftWeekKey(viewingWeekKey, -1)));
  weekNext.addEventListener("click", () => {
    if (viewingWeekKey !== currentWeekKey) loadHours(shiftWeekKey(viewingWeekKey, 1));
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  refreshClock();
  setInterval(tickClock, 1000);
</script>
</body>
</html>
